name: HCOS Council Decision Memory

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

jobs:
  export:
    if: github.event.label.name == 'council:archived'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Export council decision memory
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            const allText = [
              issue.title || "",
              issue.body || "",
              ...comments.map((comment) => comment.body || ""),
            ].join("\n");

            const blockedPatterns = [
              /-----BEGIN [A-Z ]*PRIVATE KEY-----/,
              /\b[A-Za-z0-9_]{20,}\.[A-Za-z0-9_=-]{20,}\.[A-Za-z0-9_=-]{20,}\b/,
              /\b(?:api[_-]?key|token|secret|password)\s*[:=]\s*["']?[^"'\s]{8,}/i,
              /\b0\d{5}\b/,
              /\b\d{2,4}[-/]\d{2,4}[-/]\d{3,4}\b/,
              /[\u4e00-\u9fff]{2,4}(?:さん|様|患者)/,
            ];
            const blocked = blockedPatterns.find((pattern) => pattern.test(allText));
            if (blocked) {
              core.setFailed("Council Decision Memory export aborted due to PHI/secret risk.");
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const slug = (issue.title || `issue-${issue.number}`)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 50);
            const decisionDir = "docs/adr";
            fs.mkdirSync(decisionDir, { recursive: true });
            const filename = path.join(decisionDir, `${today}_council-issue-${issue.number}-${slug || "untitled"}.md`);
            if (fs.existsSync(filename)) {
              core.notice(`Council Decision Memory already exists: ${filename}`);
              return;
            }

            const latestDecisionComment = [...comments]
              .reverse()
              .find((comment) => /decision|final|cto|結論|決定/i.test(comment.body || ""));

            const markdown = [
              "# HCOS Council Decision Memory",
              "",
              `Date: ${today}`,
              `Issue: #${issue.number}`,
              `Title: ${issue.title || ""}`,
              `URL: ${issue.html_url || ""}`,
              "",
              "## Context",
              issue.body || "(no issue body)",
              "",
              "## Final Decision Signal",
              latestDecisionComment
                ? `Author: @${latestDecisionComment.user.login}\n\n${latestDecisionComment.body || ""}`
                : "No explicit final decision comment detected.",
              "",
              "## Council Transcript Index",
              ...comments.map((comment, idx) => `${idx + 1}. @${comment.user.login} (${comment.created_at})`),
            ].join("\n");

            fs.writeFileSync(filename, `${markdown}\n`, "utf8");
            core.notice(`Generated ${filename}`);

      - name: Commit council decision memory
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "Add Council Decision Memory for issue #${{ github.event.issue.number }}"
          file_pattern: docs/adr/*.md
