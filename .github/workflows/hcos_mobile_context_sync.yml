name: HCOS Mobile Context Sync

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .github/ISSUE_TEMPLATE/**

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERTEX_MODEL: ${{ vars.VERTEX_MODEL || 'gemini-2.5-flash' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
    steps:
      - name: Check GCP configuration
        id: gcp_check
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER not set — Mobile Context Sync skipped. Configure WIF secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      # Issue #36: Switch from API key to WIF/OIDC for GitHub Actions authentication.
      - name: Authenticate to Google Cloud (WIF)
        if: steps.gcp_check.outputs.configured == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 600s

      - name: Generate updated mobile_ai_context.md
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        with:
          script: |
            const fs = require("fs");

            const model = process.env.VERTEX_MODEL || "gemini-2.5-flash";
            const projectId = process.env.GCP_PROJECT_ID;
            const location = process.env.GCP_LOCATION || "us-central1";
            const accessToken = process.env.GOOGLE_ACCESS_TOKEN;

            if (!projectId || !accessToken) {
              core.warning("GCP_PROJECT_ID or WIF access token is not configured; mobile_ai_context sync is not active yet.");
              await core.summary
                .addHeading("HCOS Mobile Context Sync skipped")
                .addRaw("Configure WIF secrets (`GCP_WORKLOAD_IDENTITY_PROVIDER`, `GCP_SERVICE_ACCOUNT_EMAIL`) and `GCP_PROJECT_ID` variable.")
                .write();
              return;
            }

            const agentsMd = fs.readFileSync("AGENTS.md", "utf8");
            const mobileContextMd = fs.readFileSync("docs/mobile_ai_context.md", "utf8");

            const systemInstruction = [
              "You are an HCOS documentation maintainer.",
              "Update the Mobile AI Context Pack markdown file based on the latest AGENTS.md content.",
              "Keep the exact same structure and section headings as the current file.",
              "Update only sections that reflect information from AGENTS.md (Active repositories, Core Rules, AI Roles).",
              "Do NOT change the Issue Format template, Mobile Prompt template, or instructional prose sections.",
              "Output only the complete updated markdown file, no explanation.",
              "Never include PHI, credentials, or secrets.",
            ].join("\n");

            const userPrompt = [
              "Current mobile_ai_context.md:",
              mobileContextMd,
              "",
              "Latest AGENTS.md:",
              agentsMd,
              "",
              "Update mobile_ai_context.md to reflect any changes in AGENTS.md.",
            ].join("\n");

            const response = await fetch(`https://${location}-aiplatform.googleapis.com/v1/projects/${projectId}/locations/${location}/publishers/google/models/${model}:generateContent`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: [{ role: "user", parts: [{ text: userPrompt }] }],
                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 4096,
                },
              }),
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Gemini API request failed: ${response.status} ${errorText}`);
              return;
            }

            const data = await response.json();
            const markdown = data?.candidates?.[0]?.content?.parts?.map((part) => part.text || "").join("").trim()
              .replace(/^```(?:markdown)?\s*/i, "")
              .replace(/\s*```$/i, "");

            if (!markdown) {
              core.setFailed("Gemini API returned no markdown content.");
              return;
            }

            fs.writeFileSync("docs/mobile_ai_context.md", `${markdown}\n`, "utf8");
            core.notice("docs/mobile_ai_context.md regenerated successfully.");

      - name: Commit updated mobile_ai_context
        if: steps.gcp_check.outputs.configured == 'true'
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "docs: auto-update mobile_ai_context.md"
          file_pattern: docs/mobile_ai_context.md

      - name: Notify Issue #8
        if: steps.gcp_check.outputs.configured == 'true' && steps.auto_commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body: [
                "## mobile_ai_context.md が更新されました",
                "",
                `更新トリガー: \`${context.payload.commits?.[0]?.message?.split('\n')[0] || 'push to main'}\``,
                `コミット: ${context.sha.slice(0, 7)}`,
                "",
                "**Gemへの手動登録が必要です:**",
                "1. [`docs/mobile_ai_context.md`](https://github.com/akaza-lab-org/HealthCheck-OS/blob/main/docs/mobile_ai_context.md) を開く",
                "2. 内容をコピーしてGemのナレッジに登録する",
              ].join("\n"),
            });
