name: HCOS AI Council

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch static council kickoff comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- hcos-ai-council -->";
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;

            const labelNames = new Set((issue.labels || []).map((label) => label.name || ""));
            const isCouncil = labelNames.has("council") || labelNames.has("architecture");
            if (!isCouncil) return;

            const councilTypeMatch = (issue.body || "").match(/Council Type\s*\r?\n([^\r\n]+)/i);
            const councilType = (councilTypeMatch?.[1] || "").trim() || "Unspecified";

            const participantNames = ["Codex", "Claude", "Gemini", "Antigravity"]
              .filter((name) => new RegExp(`-\\s*\\[x\\]\\s*${name}`, "i").test(issue.body || ""));

            const fallbackParticipants = participantNames.length > 0
              ? participantNames
              : ["Codex", "Claude", "Gemini", "Antigravity"];

            const body = [
              marker,
              "## HCOS AI Council Started",
              "",
              `Council Type: ${councilType}`,
              "",
              "Participants:",
              ...fallbackParticipants.map((name) => `- ${name}`),
              "",
              "Role expectation:",
              "- Codex -> Implementation proposal",
              "- Claude -> Architecture/Safety review",
              "- Gemini -> Knowledge synthesis",
              "- Antigravity -> CTO briefing",
              "",
              "Speaking protocol (required):",
              "```markdown",
              "## [ROLE]",
              "",
              "### Analysis",
              "...",
              "",
              "### Proposal",
              "...",
              "",
              "### Risks",
              "...",
              "",
              "### Decision Suggestion",
              "...",
              "```",
              "",
              "Lifecycle authority:",
              "- council:open -> council:review: Bot or Human CTO",
              "- council:review -> council:decision: Human CTO only",
              "- council:decision -> council:archived: Bot (administrative)",
              "",
              "Static template only. No AI API calls. No LLM execution in this workflow.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            }
