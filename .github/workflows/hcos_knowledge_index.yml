name: HCOS Knowledge Index Sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write
  id-token: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    env:
      VERTEX_MODEL: ${{ vars.VERTEX_MODEL || 'gemini-2.5-flash' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
    steps:
      - name: Check GCP configuration
        id: gcp_check
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER not set — Knowledge Index Sync skipped. Configure WIF secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: main

      # Issue #36: Use WIF/OIDC instead of long-lived Gemini API key.
      - name: Authenticate to Google Cloud (WIF)
        if: steps.gcp_check.outputs.configured == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 600s

      - name: Update KNOWLEDGE_INDEX.md
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        with:
          script: |
            const fs = require("fs");
            const { execSync } = require("child_process");

            const accessToken = process.env.GOOGLE_ACCESS_TOKEN;
            const model = process.env.VERTEX_MODEL || "gemini-2.5-flash";
            const projectId = process.env.GCP_PROJECT_ID;
            const location = process.env.GCP_LOCATION || "us-central1";
            const indexPath = "docs/KNOWLEDGE_INDEX.md";

            if (!projectId || !accessToken) {
              core.warning("GCP_PROJECT_ID or WIF access token is not set. Skipping index update.");
              return;
            }

            if (!fs.existsSync(indexPath)) {
              core.setFailed(`Critical error: ${indexPath} not found.`);
              return;
            }

            // Get list of changed files in docs/ in the last commit, filtering for tier-relevant paths
            const changedFiles = execSync("git diff --name-only HEAD^ HEAD")
              .toString()
              .split("\n")
              .filter(f =>
                f.endsWith(".md") &&
                f !== indexPath &&
                /^docs\/(core|safety|adr)\/|^docs\/pattern_/.test(f)
              );

            if (changedFiles.length === 0) {
              core.info("No tier-relevant documentation changes detected. Skipping index update.");
              return;
            }

            core.info(`Detected changes in: ${changedFiles.join(", ")}`);

            const currentIndex = fs.readFileSync(indexPath, "utf8");
            
            const prompt = `
            You are the HCOS Knowledge Index maintainer.
            Your task is to update the HCOS Knowledge Index (KNOWLEDGE_INDEX.md) based on recent changes in the documentation.

            --- CURRENT KNOWLEDGE_INDEX.md ---
            ${currentIndex}

            --- CHANGED FILES ---
            ${changedFiles.join("\n")}

            --- INSTRUCTIONS ---
            1. Identify which Tier (1: Core, 2: Safety, 3: ADR, 4: Pattern) each changed file belongs to based on its path:
               - docs/core/ -> Tier 1
               - docs/safety/ -> Tier 2
               - docs/adr/ -> Tier 3
               - docs/pattern_*.md -> Tier 4
            2. For each added or modified file, ensure it is listed in the correct Tier section with its title and relative link.
            3. DO NOT remove existing valid entries.
            4. Preserve the overall structure (Headers ## Tier 1 to 4).
            5. If a file was deleted (check against current filesystem if possible, but assume presence unless told otherwise), remove its entry.
            6. Output the COMPLETE updated KNOWLEDGE_INDEX.md content. No preamble, no backticks.
            `;

            const response = await fetch(`https://${location}-aiplatform.googleapis.com/v1/projects/${projectId}/locations/${location}/publishers/google/models/${model}:generateContent`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.1 }
              })
            });

            if (!response.ok) {
              const err = await response.text();
              core.setFailed(`Gemini API error: ${response.status} ${err}`);
              return;
            }

            const data = await response.json();
            let newIndex = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!newIndex) {
              core.setFailed("Gemini returned empty content.");
              return;
            }

            // Clean up backticks if any
            newIndex = newIndex.replace(/^```markdown\n/, "").replace(/\n```$/, "").trim();

            // --- VERIFICATION ---
            const requiredHeaders = [
              "## Tier 1 — Core",
              "## Tier 2 — Safety",
              "## Tier 3 — ADR",
              "## Tier 4 — Pattern"
            ];
            for (const header of requiredHeaders) {
              if (!newIndex.includes(header)) {
                core.setFailed(`Verification failed: Missing required header "${header}"`);
                return;
              }
            }

            // Ensure Safety Tier is not empty or corrupted (check for common keywords)
            if (!newIndex.includes("safety/")) {
              core.setFailed("Verification failed: Safety Tier reference appears to be lost.");
              return;
            }

            fs.writeFileSync(indexPath, newIndex + "\n", "utf8");
            core.info("Successfully updated KNOWLEDGE_INDEX.md");

      - name: Commit and Push
        if: steps.gcp_check.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "docs: auto-update KNOWLEDGE_INDEX.md"
          file_pattern: docs/KNOWLEDGE_INDEX.md
