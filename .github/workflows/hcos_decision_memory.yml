name: HCOS Decision Memory

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: read
  pull-requests: read
  id-token: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      VERTEX_MODEL: ${{ vars.VERTEX_MODEL || 'gemini-2.5-flash' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
    steps:
      - name: Check GCP configuration
        id: gcp_check
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER not set — Decision Memory generation skipped. Configure WIF secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      # Issue #36: Authenticate with short-lived OIDC token via WIF (no long-lived API key).
      - name: Authenticate to Google Cloud (WIF)
        if: steps.gcp_check.outputs.configured == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 600s

      - name: Generate Decision Memory
        if: steps.gcp_check.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const pr = context.payload.pull_request;
            const today = new Date().toISOString().slice(0, 10);
            const model = process.env.VERTEX_MODEL || "gemini-2.5-flash";
            const projectId = process.env.GCP_PROJECT_ID;
            const location = process.env.GCP_LOCATION || "us-central1";
            const accessToken = process.env.GOOGLE_ACCESS_TOKEN;

            if (!projectId || !accessToken) {
              core.warning("GCP_PROJECT_ID or WIF access token is not configured; Decision Memory generation is not active yet.");
              await core.summary
                .addHeading("HCOS Decision Memory skipped")
                .addRaw("Configure WIF secrets (`GCP_WORKLOAD_IDENTITY_PROVIDER`, `GCP_SERVICE_ACCOUNT_EMAIL`) and `GCP_PROJECT_ID` variable.")
                .write();
              return;
            }

            const linkedIssueNumbers = Array.from(
              new Set(Array.from(`${pr.body || ""} ${pr.title || ""}`.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)).map((match) => Number(match[1])))
            );

            const issueContexts = [];
            for (const issueNumber of linkedIssueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              issueContexts.push({
                number: issue.number,
                title: issue.title,
                body: issue.body || "",
                comments: comments
                  .filter((comment) => /claude|codex|gemini|hcos|decision|safety|review/i.test(comment.body || ""))
                  .map((comment) => ({ author: comment.user.login, body: comment.body || "" })),
              });
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const claudeReviewContext = [
              ...reviews
                .filter((review) => /claude/i.test(review.user.login) || /PR Review:|Knowledge Promotion:|safety|architecture/i.test(review.body || ""))
                .map((review) => ({ author: review.user.login, state: review.state, body: review.body || "" })),
              ...reviewComments
                .filter((comment) => /claude/i.test(comment.user.login) || /safety|architecture|decision|knowledge/i.test(comment.body || ""))
                .map((comment) => ({ author: comment.user.login, path: comment.path, body: comment.body || "" })),
            ];

            const payload = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              mergedAt: pr.merged_at,
              pullRequest: {
                number: pr.number,
                title: pr.title,
                body: pr.body || "",
                url: pr.html_url,
              },
              linkedIssues: issueContexts,
              claudeReviewContext,
            };

            const combinedText = JSON.stringify(payload);
            const secretPatterns = [
              /-----BEGIN [A-Z ]*PRIVATE KEY-----/,
              /\b[A-Za-z0-9_]{20,}\.[A-Za-z0-9_=-]{20,}\.[A-Za-z0-9_=-]{20,}\b/,
              /\b(?:api[_-]?key|token|secret|password)\s*[:=]\s*["']?[^"'\s]{8,}/i,
            ];
            const phiPatterns = [
              /\b0\d{5}\b/,
              /\b\d{2,4}[-/]\d{2,4}[-/]\d{3,4}\b/,
              /\b(?:patient[_ -]?id|chart[_ -]?id|カルテ番号|患者番号)\s*[:=：]\s*\d{6,}\b/i,
              /[\u4e00-\u9fff]{2,4}(?:さん|様|患者)/,
            ];
            const rawLogPatterns = [
              /^Traceback \(most recent call last\):/m,
              /^\s*at\s+\S+\s+\(.+:\d+:\d+\)/m,
              /\b(ERROR|WARN|INFO)\b.*\b\d{2}:\d{2}:\d{2}\b/,
            ];
            const blockedBy = [
              ...secretPatterns.map((pattern) => ({ kind: "credential", pattern })),
              ...phiPatterns.map((pattern) => ({ kind: "phi", pattern })),
              ...rawLogPatterns.map((pattern) => ({ kind: "raw-log", pattern })),
            ].find(({ pattern }) => pattern.test(combinedText));

            if (blockedBy) {
              core.setFailed(`Decision Memory generation aborted: ${blockedBy.kind} risk detected in PR/Issue/review context.`);
              return;
            }

            const systemInstruction = [
              "You are HCOS Decision Memory generator.",
              "Your task is to extract organizational knowledge from a merged pull request.",
              "Focus on WHY decisions were made.",
              "Do NOT describe code changes.",
              "Output structured markdown using the provided template.",
              "Include decision, context, reasoning, rejected alternatives, safety implications, and reconsider triggers.",
              "Avoid implementation detail.",
              "Never include PHI, credentials, raw logs, or secrets.",
              "Summarize only.",
            ].join("\n");
            const template = fs.readFileSync("docs/adr/_template.md", "utf8");
            const prompt = [
              systemInstruction,
              "",
              "Use this template shape:",
              "```markdown",
              template,
              "```",
              "",
              "Context payload:",
              "```json",
              JSON.stringify(payload, null, 2),
              "```",
            ].join("\n");

            const response = await fetch(`https://${location}-aiplatform.googleapis.com/v1/projects/${projectId}/locations/${location}/publishers/google/models/${model}:generateContent`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 2048,
                },
              }),
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Gemini API request failed: ${response.status} ${errorText}`);
              return;
            }

            const data = await response.json();
            const markdown = data?.candidates?.[0]?.content?.parts?.map((part) => part.text || "").join("").trim()
              .replace(/^```(?:markdown)?\s*/i, "")
              .replace(/\s*```$/i, "");
            if (!markdown) {
              core.setFailed("Gemini API returned no Decision Memory markdown.");
              return;
            }

            const outputRisk = blockedBy || [
              ...secretPatterns.map((pattern) => ({ kind: "credential", pattern })),
              ...phiPatterns.map((pattern) => ({ kind: "phi", pattern })),
              ...rawLogPatterns.map((pattern) => ({ kind: "raw-log", pattern })),
            ].find(({ pattern }) => pattern.test(markdown));
            if (outputRisk) {
              core.setFailed(`Decision Memory generation aborted: ${outputRisk.kind} risk detected in generated markdown.`);
              return;
            }

            const titleSlug = pr.title
              .toLowerCase()
              .replace(/^\[hcos\]\s*/i, "")
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 50);
            const slug = `pr-${pr.number}${titleSlug ? `-${titleSlug}` : ""}`;
            const decisionDir = "docs/adr";
            fs.mkdirSync(decisionDir, { recursive: true });
            const filename = path.join(decisionDir, `${today}_${slug}.md`);
            const headerFixed = markdown
              .replace(/^Date:\s*$/m, `Date: ${today}`)
              .replace(/^Related PR:\s*$/m, `Related PR: #${pr.number}`)
              .replace(/^Related Issue:\s*$/m, `Related Issue: ${linkedIssueNumbers.map((number) => `#${number}`).join(", ") || "None"}`);

            if (fs.existsSync(filename)) {
              core.notice(`Decision Memory already exists: ${filename}`);
              return;
            }

            fs.writeFileSync(filename, `${headerFixed}\n`, "utf8");
            core.notice(`Generated ${filename}`);

      - name: Commit Decision Memory
        if: steps.gcp_check.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "Add Decision Memory for PR #${{ github.event.pull_request.number }}"
          file_pattern: docs/adr/*.md
