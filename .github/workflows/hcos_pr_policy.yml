name: HCOS PR Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate HCOS PR gate
        uses: actions/github-script@v7
        with:
          script: |
            let pullNumber = context.issue.number;
            if (context.eventName === "pull_request" || context.eventName === "pull_request_review") {
              pullNumber = context.payload.pull_request.number;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            const body = pull.body || "";
            const missing = [];

            // Fetch changed files first to determine PR type
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const changedFiles = files.map((file) => file.filename);

            // Docs-only bypass: skip Closes#N and safety checkboxes for pure documentation PRs
            const docsOnlyPattern = /^(docs\/|README\.md|AGENTS\.md|CHANGELOG\.md)/;
            const isDocsOnly = changedFiles.length > 0 && changedFiles.every(f => docsOnlyPattern.test(f));

            if (!isDocsOnly) {
              if (!/Closes\s+#\d+/i.test(body)) {
                missing.push("Linked Issue must include `Closes #<issue-number>`.");
              }

              const requiredChecks = [
                "No PHI leakage risk",
                "External AI usage reviewed",
                "Logging safety verified",
                "All tests passing",
              ];
              for (const item of requiredChecks) {
                const pattern = new RegExp(`-\\s*\\[[xX]\\]\\s*${item.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`);
                if (!pattern.test(body)) {
                  missing.push(`PR template checkbox is incomplete: ${item}`);
                }
              }
            }

            const needsPromotion = {
              Pattern: /-\s*\[[xX]\]\s*Pattern/.test(body),
              ADR: /-\s*\[[xX]\]\s*ADR/.test(body),
              "Safety Rule": /-\s*\[[xX]\]\s*Safety rule/.test(body),
            };
            const promotionNeeded = Object.values(needsPromotion).some(Boolean);

            if (promotionNeeded) {
              const hasDocPromotion = changedFiles.some((file) =>
                /^docs\/(adr\/|safety\/|core\/|patterns\/).+\.md$/.test(file)
              );
              const hasAgentsUpdate = changedFiles.includes("AGENTS.md");
              if (!hasDocPromotion) {
                missing.push("Knowledge promotion is checked, but no `docs/adr/*`, `docs/safety/*`, `docs/core/*`, or `docs/patterns/*` file is included.");
              }
              if (!hasAgentsUpdate) {
                missing.push("Knowledge promotion is checked, but `AGENTS.md` Read First was not updated.");
              }
            }

            // Safety Gate v2: KNOWLEDGE_INDEX and Safety Tier verification
            if (changedFiles.some(file => file.startsWith("docs/"))) {
              const { data: indexFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "docs/KNOWLEDGE_INDEX.md",
                ref: pull.head.sha
              }).catch(() => ({ data: null }));

              if (!indexFile) {
                missing.push("Documentation changes detected, but `docs/KNOWLEDGE_INDEX.md` is missing.");
              } else {
                const content = Buffer.from(indexFile.content, 'base64').toString('utf8');
                if (!content.includes("## Tier 2 — Safety")) {
                  missing.push("`docs/KNOWLEDGE_INDEX.md` is corrupted: Safety Tier (Tier 2) section is missing.");
                }
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const latestReviews = new Map();
            for (const review of reviews) {
              latestReviews.set(review.user.login, review);
            }
            const hasClaudeApproval = Array.from(latestReviews.values()).some((review) =>
              (review.state === "APPROVED" || (review.state === "COMMENTED" && /PR Review:\s*Approve/i.test(review.body || ""))) &&
              (/claude/i.test(review.user.login) || /PR Review:\s*Approve/i.test(review.body || ""))
            );

            if (!hasClaudeApproval) {
              missing.push("Claude approval is required. Expected review signal: `PR Review: Approve`.");
            }

            if (missing.length > 0) {
              core.setFailed(["HCOS PR gate failed:", ...missing.map((item) => `- ${item}`)].join("\n"));
            } else {
              core.notice("HCOS PR gate passed: linked issue, safety checks, tests, Claude approval, and knowledge promotion requirements are satisfied.");
            }
